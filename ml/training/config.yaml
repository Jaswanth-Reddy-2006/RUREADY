# ══════════════════════════════════════════════════════════════════════════
# RU Ready AI Interviewer Model — Training Configuration
# ══════════════════════════════════════════════════════════════════════════

model:
  # Recommended base models:
  # - "meta-llama/Llama-3.2-3B-Instruct" (Super fast, fits in 8GB VRAM)
  # - "Qwen/Qwen2.5-Coder-7B-Instruct"  (Elite coding & technical reasoning)
  # - "meta-llama/Llama-3.1-8B-Instruct" (Flagship depth and conversational fluency)
  name: "meta-llama/Llama-3.2-3B-Instruct"
  quantization: "4bit" # "4bit" | "8bit" | "none"
  torch_dtype: "bfloat16"

dataset:
  train_file: "ml/dataset/splits/train.jsonl"
  test_file: "ml/dataset/splits/test.jsonl"
  max_seq_length: 2048

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "ml/models/ru_ready_interviewer_adapter"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: "epoch"
  fp16: false
  bf16: true

hub:
  push_to_hub: false
  hub_model_id: "your-username/ru-ready-interviewer-3b-qlora"
